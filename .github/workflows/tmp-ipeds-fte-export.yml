name: Temporary IPEDS matched-data split

on:
  push:
    paths:
      - '.github/workflows/tmp-ipeds-fte-export.yml'

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Split matched table
        shell: bash
        run: |
          python - <<'PY'
          import csv

          with open('tmp_rd_per_fte_matches.csv', encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f))
          fields = list(rows[0])
          size = 31
          for part, start in enumerate(range(0, len(rows), size), start=1):
              path = f'tmp_rd_per_fte_part{part}.csv'
              with open(path, 'w', encoding='utf-8', newline='') as f:
                  writer = csv.DictWriter(f, fieldnames=fields)
                  writer.writeheader()
                  writer.writerows(rows[start:start+size])
              print(path, len(rows[start:start+size]))
          PY

      - name: Commit temporary chunks
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp_rd_per_fte_part*.csv
          git commit -m 'Split temporary R&D per FTE data'
          git push
