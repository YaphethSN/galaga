name: Temporary CWTS PP1 extraction

on:
  push:
    branches: [tmp-cwts-pp1-20250727]
    paths:
      - '.github/workflows/tmp-cwts-pp1.yml'
      - 'tmp_cwts_trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp-cwts-pp1-20250727
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4 lxml
      - name: Fetch CWTS PP(top 1%)
        run: |
          cat > /tmp/fetch_cwts.py <<'PY'
          import csv, requests
          from bs4 import BeautifulSoup

          url = 'https://traditional.leidenranking.com/Ranking2025/Ranking2025ListResult'
          payload = {
              'field_id': '1',
              'continent_code': '',
              'country_code': '',
              'performance_dimension': '0',
              'ranking_indicator': '1',
              'fractional_counting': 'true',
              'core_pub_only': 'false',
              'number_of_publications': '100',
              'period_id': '15',
              'period_text': '2020–2023',
              'order_by': 'pp_top1',
          }
          headers = {
              'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126 Safari/537.36',
              'Content-Type': 'application/x-www-form-urlencoded',
              'Accept': '*/*, text/html',
              'X-Requested-With': 'XMLHttpRequest',
              'Referer': 'https://traditional.leidenranking.com/ranking/2025/list',
              'Origin': 'https://traditional.leidenranking.com',
          }
          r = requests.post(url, data=payload, headers=headers, timeout=120)
          r.raise_for_status()
          open('cwts_pp1_raw.html','w',encoding='utf-8').write(r.text)
          soup = BeautifulSoup(r.text, 'lxml')

          def tooltip(cell):
              div = cell.find('div', attrs={'data-tooltip': True})
              if div:
                  tip = BeautifulSoup(div.get('data-tooltip',''), 'html.parser').get_text(' ', strip=True)
                  if tip:
                      return tip
              return cell.get_text(' ', strip=True)

          rows=[]
          for tr in soup.find_all('tr'):
              cells=tr.find_all('td')
              if len(cells) < 5:
                  continue
              rank=cells[0].get_text(' ',strip=True)
              uni=cells[1].get_text(' ',strip=True)
              p=tooltip(cells[2])
              p_top1=tooltip(cells[3])
              pp_top1=tooltip(cells[4])
              if uni:
                  rows.append([rank,uni,p,p_top1,pp_top1])
          if len(rows) < 100:
              raise RuntimeError(f'Only parsed {len(rows)} rows; response length={len(r.text)}')
          with open('cwts_pp1_all.csv','w',newline='',encoding='utf-8') as f:
              w=csv.writer(f); w.writerow(['rank','university','P','P_top1','PP_top1']); w.writerows(rows)
          print('parsed',len(rows),'rows')
          print(rows[:5])
          PY
          python /tmp/fetch_cwts.py
      - name: Commit extracted data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cwts_pp1_all.csv cwts_pp1_raw.html
          git commit -m 'Extract official CWTS 2025 PP1 data' || exit 0
          git push origin HEAD:tmp-cwts-pp1-20250727
